modLoader="kotlinforforge"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    authors="${mod_authors}"
    description='''${mod_description}'''
    logoFile="appliedcreate_icon.png"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="REQUIRED"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="REQUIRED"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="create"
    type="REQUIRED"
    versionRange="${create_version_range}"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="kotlinforforge"
    type="REQUIRED"
    versionRange="${loader_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="ae2"
    type="REQUIRED"
    versionRange="${ae2_version_range}"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="jei"
    type="OPTIONAL"
    versionRange="[19,)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="ae2jeiintegration"
    type="OPTIONAL"
    versionRange="[1.0,)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="configured"
    type="OPTIONAL"
    versionRange="[2.6.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="extendedae"
    type="OPTIONAL"
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="advanced_ae"
    type="OPTIONAL"
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
    config = "appliedcreate.mixins.json"
